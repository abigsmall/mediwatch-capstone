[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediwatch-capstone"
version = "0.1.0"
description = "End-to-end MLOps capstone for patient readmission prediction."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3>=1.34.0",
  "catboost>=1.2.10",
  "evidently>=0.4.27",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "joblib>=1.4.0",
  "mlflow>=2.17.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.9.0",
  "pytest>=8.3.0",
  "python-multipart>=0.0.12",
  "ray[tune]>=2.37.0",
  "requests>=2.32.0",
  "scikit-learn>=1.5.0",
  "streamlit>=1.39.0",
  "uvicorn>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.0",
  "notebook>=7.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
