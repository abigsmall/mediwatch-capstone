services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: uvicorn mediwatch.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

  ui:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: streamlit run src/mediwatch/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      MEDIWATCH_API_URL: http://api:8000
      PYTHONPATH: /app/src
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv pip install --system mlflow psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlruns.db
      --default-artifact-root /app/mlruns"
    volumes:
      - ./:/app
    ports:
      - "5001:5000"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-mediwatch-airflow-secret-key}
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email airflow@example.com || true"
    depends_on:
      - postgres

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-mediwatch-airflow-secret-key}
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-mediwatch-airflow-secret-key}
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
