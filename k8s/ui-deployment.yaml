apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediwatch-ui
  namespace: mediwatch
  labels:
    app: mediwatch-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediwatch-ui
  template:
    metadata:
      labels:
        app: mediwatch-ui
    spec:
      containers:
        - name: ui
          image: mediwatch-api:local
          imagePullPolicy: IfNotPresent
          command:
            - streamlit
            - run
            - src/mediwatch/ui/streamlit_app.py
          args:
            - --server.port
            - "8501"
            - --server.address
            - 0.0.0.0
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: MEDIWATCH_API_URL
              value: http://mediwatch-api:8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
